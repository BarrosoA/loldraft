<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LolDraft • Real-Time Drafting Companion & Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.2.0">
</head>
<body>
  <div class="app-shell">
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-mark">
          <span class="brand-icon">⬢</span>
          <span class="brand-name">LolDraft</span>
        </div>
        <div class="patch-badge" id="patchBadge">
          <span class="pulse-dot"></span>
          PATCH 16.19 • EMERALD+
        </div>
      </div>


      <div class="header-actions">
        <button class="btn btn-secondary" id="resetBtn" title="Reset all slots">
          <span>↺</span> Clear Draft
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-layout">
      <!-- Left Column: Ally Team -->
      <aside class="team-panel ally-panel">
        <div class="panel-header">
          <div class="panel-title ally-title">
            <span class="team-dot blue-dot"></span>
            <span>YOUR TEAM</span>
          </div>
          <span class="badge" id="allyCount">0/5 Locked</span>
        </div>

        <div class="damage-meter-card">
          <div class="damage-meter-label">
            <span>Damage Balance</span>
            <span id="damageSummaryText">50% AD / 50% AP</span>
          </div>
          <div class="damage-bar">
            <div class="dmg-segment dmg-phys" id="dmgPhysBar" style="width: 50%;"></div>
            <div class="dmg-segment dmg-magic" id="dmgMagicBar" style="width: 50%;"></div>
          </div>
          <div class="damage-legend">
            <span class="legend-item"><span class="legend-dot phys-dot"></span> <span id="physPctLabel">50%</span> AD</span>
            <span class="legend-item"><span class="legend-dot magic-dot"></span> <span id="magicPctLabel">50%</span> AP</span>
          </div>
        </div>

        <div class="slots-container" id="allySlots">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Center Column: Champion Selector + Suggested Picks -->
      <div class="center-workspace">
        <section class="picker-panel">
          <div class="picker-header">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" id="searchInput" placeholder="Search champion (e.g. Akali, Aatrox, Ahri)..." autocomplete="off">
              <button id="clearSearchBtn" class="clear-search-btn">✕</button>
            </div>
            <div class="filter-pills" id="pickerRoleFilter">
              <button class="filter-pill active" data-filter="all">ALL</button>
              <button class="filter-pill" data-filter="top">TOP</button>
              <button class="filter-pill" data-filter="jungle">JGL</button>
              <button class="filter-pill" data-filter="middle">MID</button>
              <button class="filter-pill" data-filter="bottom">BOT</button>
              <button class="filter-pill" data-filter="support">SUP</button>
            </div>
          </div>

          <div class="champions-grid" id="championsGrid">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Suggested Picks (Same Width as Champion Select) -->
        <section class="hud-panel" id="hudPanel" data-view="best">
          <div class="hud-header">
            <div class="hud-left">
              <div class="hud-title-row">
                <span class="hud-indicator" id="hudIndicator"></span>
                <h2 class="hud-title" id="hudTitleHeading"><span id="hudTitlePrefix">Suggested Picks</span> - <span id="hudRoleLabel">TOP</span></h2>
              </div>
            </div>

            <div class="hud-center">
              <div class="segmented-control" id="hudSegmentedControl" role="tablist" aria-label="Recommendation Mode">
                <button type="button" role="tab" id="tabBest" aria-selected="true" aria-controls="recommendationsList" class="seg-btn active" data-tab="best">
                  <svg class="seg-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                  </svg>
                  <span>Best Picks</span>
                  <span class="seg-badge seg-badge-best">TOP 10</span>
                </button>
                <button type="button" role="tab" id="tabOffmeta" aria-selected="false" aria-controls="recommendationsList" class="seg-btn" data-tab="offmeta">
                  <svg class="seg-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.381z" clip-rule="evenodd"/>
                  </svg>
                  <span>Off-Meta</span>
                  <span class="seg-badge seg-badge-offmeta">NICHE</span>
                </button>
                <button type="button" role="tab" id="tabWorst" aria-selected="false" aria-controls="recommendationsList" class="seg-btn" data-tab="worst">
                  <svg class="seg-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                  </svg>
                  <span>Worst Picks</span>
                  <span class="seg-badge seg-badge-worst">AVOID</span>
                </button>
              </div>
            </div>
          </div>

          <div class="recommendations-carousel" id="recommendationsList" role="tabpanel">
            <!-- Live Cards injected here -->
          </div>
        </section>
      </div>

      <!-- Right Column: Enemy Team -->
      <aside class="team-panel enemy-panel">
        <div class="panel-header">
          <div class="panel-title enemy-title">
            <span class="team-dot red-dot"></span>
            <span>ENEMY TEAM</span>
          </div>
          <span class="badge" id="enemyCount">0/5 Locked</span>
        </div>

        <div class="enemy-inference-info">
          <span class="info-icon">ℹ️</span>
          <span>Bayesian role inference automatically predicts hidden enemy lanes.</span>
        </div>

        <div class="slots-container" id="enemySlots">
          <!-- Populated by JS -->
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js?v=2.2.0"></script>
</body>
</html>
